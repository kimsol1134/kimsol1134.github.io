<title>인류 패치노트 · Humanity Patch Notes</title>
<style>
:root{--paper:#f4f2e9;--card:#fffdf7;--ink:#20302c;--muted:#768078;--line:#d9ddd1;--green:#185947;--green2:#2c7560;--orange:#ed845d;--bad:#bd553e;--soft:#e8ece2;--shadow:0 18px 55px rgba(24,52,43,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e9df}body{background-image:linear-gradient(rgba(105,120,102,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(105,120,102,.09) 1px,transparent 1px);background-size:34px 34px}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.app{width:min(100%,500px);min-height:100dvh;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:var(--shadow)}.screen{min-height:100dvh;padding:22px 20px 26px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:1.6px}.mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff}.ghost{border:0;background:transparent;color:#68776e;padding:9px;border-radius:12px}.ghost:hover{background:var(--soft)}.hero{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;padding:32px 4px}.pill{font-size:10px;letter-spacing:1.5px;border:1px solid #cad4c6;background:#edf0e8;border-radius:999px;padding:7px 11px;color:#5b745f}.hero h1{font-size:52px;line-height:1.04;letter-spacing:-4px;margin:20px 0 0}.hero h1 em{font-style:normal;color:var(--green)}.hero .tag{font-size:17px;font-weight:750;margin-top:15px}.hero .desc{font-size:13px;line-height:1.75;color:var(--muted);margin-top:10px}.planet{width:220px;height:220px;border-radius:50%;margin:24px 0 18px;position:relative;background:radial-gradient(circle at 38% 35%,#e7efe2 0 14%,#a9cbb6 15% 38%,#75a587 39% 58%,#296b57 59% 100%);box-shadow:inset -22px -20px 0 rgba(12,62,49,.16),0 25px 30px rgba(42,71,55,.14);animation:float 5s ease-in-out infinite}.planet:before,.planet:after{content:"";position:absolute;border-radius:50%;background:#d9e8bc;opacity:.85}.planet:before{width:72px;height:36px;left:25px;top:55px;transform:rotate(-18deg)}.planet:after{width:48px;height:78px;right:38px;bottom:38px;transform:rotate(28deg)}.statsIntro{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:8px;border-top:1px solid var(--line);padding-top:15px}.statsIntro strong{font-size:17px;display:block}.statsIntro span{font-size:10px;color:var(--muted)}.primary,.secondary{width:100%;border-radius:14px;padding:16px 18px;font-weight:800;border:0}.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 #0b392f}.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #0b392f}.secondary{background:var(--card);border:1px solid var(--line);margin-top:10px}.micro{text-align:center;color:var(--muted);font-size:11px;line-height:1.55;margin:14px 0 0}.phase{display:flex;align-items:center;justify-content:space-between;margin:14px 1px 7px;font-size:11px}.progress{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-bottom:12px}.progress i{height:4px;border-radius:4px;background:#d9ddd2}.progress i.done{background:#74937d}.progress i.now{background:var(--orange)}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#e9ece3;border:1px solid #dde2d7;padding:10px;border-radius:14px}.meter{text-align:center}.meter b{font-size:17px}.meter span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.track{height:4px;margin-top:6px;background:#d2d9cf;border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:#789781}.meter.danger b{color:var(--bad)}.meter.danger .track i{background:var(--bad)}.rulesLabel{font-size:10px;color:var(--muted);margin:12px 0 6px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rule{font-size:10px;font-weight:700;text-align:center;padding:8px 3px;background:#e5ecdf;border:1px solid #d3decf;border-radius:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rule.empty{background:transparent;border-style:dashed;color:#9aa095}.news{font-size:11px;line-height:1.55;color:#59705e;background:#e7ece2;padding:10px 11px;border-radius:10px;margin:10px 0}.cardStack{position:relative;flex:1;min-height:390px;display:flex;align-items:stretch}.cardStack:before{content:"";position:absolute;inset:8px 7px 1px;background:#e4e4da;border:1px solid #d8d8ce;border-radius:20px;transform:rotate(1.5deg)}.card{position:relative;z-index:2;width:100%;background:var(--card);border:1px solid #d9d9cf;border-radius:19px;padding:18px 17px 15px;box-shadow:0 12px 28px rgba(40,57,46,.08);display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .16s ease,opacity .16s ease}.eyebrow{font-size:9px;font-weight:800;letter-spacing:1.5px;color:#6e806f}.actor{font-size:11px;color:#758078;margin-top:6px}.avatar{width:70px;height:70px;margin:18px auto 13px;border-radius:50%;display:grid;place-items:center;background:#e8eadf;border:1px solid #d7dccf;font-size:34px}.card h2{text-align:center;font-size:29px;line-height:1.16;letter-spacing:-1.9px;margin:4px 0 12px;white-space:pre-line}.body{text-align:center;font-size:13px;line-height:1.75;color:#68736b;margin:0 auto 18px;max-width:380px}.choices{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:76px;padding:11px;border:1px solid var(--line);background:#faf9f3;border-radius:12px;font-size:12px;font-weight:750;line-height:1.35}.choice:hover{background:#edf0e6}.choice:first-child:hover{border-color:#d49a86}.choice:last-child:hover{border-color:#8eae99}.hint{font-size:10px;color:#8a928a;text-align:center;margin:11px 0 1px}.resultBox{margin-top:8px;padding:13px;background:#edf0e8;border-radius:12px;font-size:12px;line-height:1.6;color:#52665a}.end{justify-content:center;text-align:center}.status{font-size:10px;letter-spacing:1.5px;color:#5d765f;font-weight:800}.end h1{font-size:38px;line-height:1.08;letter-spacing:-2.4px;margin:15px 0 10px}.endDesc{font-size:14px;line-height:1.75;color:var(--muted);margin:auto;max-width:390px}.endPlanet{font-size:82px;margin:20px 0 4px}.scoreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.scoreGrid div{background:#e9ece3;border-radius:12px;padding:12px 4px}.scoreGrid strong{display:block;font-size:21px}.scoreGrid span{font-size:9px;color:var(--muted)}.patches{text-align:left;background:#263d35;color:#f4f4ec;border-radius:15px;padding:15px;margin-bottom:12px}.patchTitle{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.3px;color:#bcd0c4;margin-bottom:10px}.patch{padding:9px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11px;line-height:1.5}.actions2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d332b;color:#fff;border-radius:999px;padding:11px 16px;font-size:12px;z-index:9;box-shadow:var(--shadow)}.hidden{display:none!important}@keyframes float{50%{transform:translateY(-8px)}}@media(min-width:540px){.app{margin:24px auto;min-height:calc(100dvh - 48px);border-radius:28px}.screen{min-height:calc(100dvh - 48px)}}

<script>
const APP_URL='https://kimsol1134.github.io/humanity-patchnotes/';
const R={nosleep:{n:'수면 삭제',note:'수면을 삭제했습니다. 회사는 야간을 낮처럼 사용하기 시작했습니다.'},shortwork:{n:'주 3일 노동',note:'근무일을 줄였습니다. 달력 회사가 긴장하기 시작했습니다.'},immortal:{n:'불멸',note:'죽음을 수정했습니다. 주거 문제는 아직 수정하지 않았습니다.'},photo:{n:'인간 광합성',note:'인간에게 광합성을 추가했습니다. 남향의 가치가 달라졌습니다.'},hive:{n:'기억 공유',note:'기억을 동기화했습니다. 흑역사도 성공적으로 동기화했습니다.'},truth:{n:'거짓말 금지',note:'거짓말을 막았습니다. 안부 인사가 위험해졌습니다.'},robots:{n:'로봇 노동',note:'노동을 자동화했습니다. 로봇은 휴가라는 단어를 학습 중입니다.'},bliss:{n:'행복 고정',note:'불행 알림을 껐습니다. 문제가 해결된 것은 아닙니다.'}};
const EM={scientist:'🧑‍🔬',worker:'🧑‍💼',elder:'🧓',plant:'🌱',robot:'🤖',child:'🧒',journalist:'🎙️',mayor:'🏛️',chef:'🧑‍🍳'};
const C=(label,fx,after,opt={})=>({label,fx,after,...opt});
const card=(type,actor,pic,title,body,a,b,opt={})=>({type,actor,pic,title,body,ch:[a,b],...opt});
const has=(s,r)=>s.rules.includes(r),flag=(s,f)=>!!s.flags[f];
const openings=[
 s=>card('핵심 패치','하나 · 연구소장','scientist','수면 기능을\n삭제할까요?','인류가 잠 때문에 일을 못 한다고 합니다. 일을 줄여도 되지만, 수면을 지우는 편이 더 혁신적으로 들립니다.',C('잠을 없앤다',{stock:10,joy:-4,free:-4,trust:3},'인류가 잠에서 영원히 깨어났습니다. 회사도 깨어 있기로 했습니다.',{add:'nosleep'}),C('주 3일만 일한다',{stock:-12,joy:12,free:7,trust:-2},'인류가 환호했습니다. 달력 회사는 수요일 옆에 작은 하트를 그렸습니다.',{add:'shortwork'})),
 s=>has(s,'nosleep')?card('후속 사건','모아 · 시민대표','worker','퇴근 버튼이\n사라졌습니다.','“잠 안 자잖아?”라는 말 한마디로 야근이 정상근무가 됐습니다.',C('근무시간 상한을 둔다',{stock:-8,joy:10,free:8,trust:3},'잠은 없어도 퇴근은 생겼습니다.',{f:'worklimit'}),C('초과근무 3배 임금',{stock:-4,joy:5,free:2,trust:6},'급여명세서는 두꺼워졌습니다. 달력은 아직 월요일입니다.',{f:'overtime'})):card('후속 사건','모아 · 시민대표','worker','금요일이\n너무 많습니다.','사흘만 일하니 행복합니다. 문제는 나흘 동안 쓸 것을 사흘 안에 만들어야 한다는 점입니다.',C('회의부터 줄인다',{stock:10,joy:-3,trust:3},'회의 절반이 사라졌는데 아무도 찾지 않았습니다.',{f:'efficient'}),C('조금 덜 소비한다',{stock:7,joy:-2,free:5,trust:2},'새 휴대폰 대신 소풍을 택했습니다.',{f:'frugal'})),
 s=>card('핵심 패치','하나 · 연구소장','scientist','인간의 몸을\n업데이트합니다.','연구팀은 부작용이라는 말 대신 “후속 콘텐츠”라고 부릅니다.',C('죽음을 없앤다',{joy:14,stock:-8,free:-1,trust:2},'오늘부터 아무도 늙어 죽지 않습니다.',{add:'immortal'}),C('햇빛으로 배를 채운다',{stock:12,joy:-3,trust:-3},'인류가 초록빛을 띠기 시작했습니다.',{add:'photo'})),
 s=>has(s,'immortal')?card('규칙 후폭풍','오래 · 214세 시민','elder','퇴직 예정일이\n무기한 연기됐습니다.','직장도 집도 자리가 나지 않습니다.',C('자리와 역할을 순환한다',{free:10,joy:4,stock:-6,trust:4},'214세 신입 음악가가 탄생했습니다.',{f:'rotation'}),C('살 공간부터 늘린다',{stock:-12,joy:8,trust:7},'건물에 층을 더했습니다. 이제 엘리베이터가 병목입니다.',{f:'housing'})):card('규칙 후폭풍','모모 · 초등학생','plant','흐린 날엔\n굶어요?','급식실이 옥상으로 옮겨갔습니다. 과학자들이 처음으로 일기예보를 켰습니다.',C('햇빛을 저장한다',{stock:-8,trust:9,joy:4},'햇빛 배터리를 배부했습니다.',{f:'sunbattery'}),C('먹는 기능도 남겨둔다',{stock:-4,free:7,joy:5},'광합성은 선택 기능이 됐습니다.',{f:'hybridfood'})),
 s=>card('확장 패치','루프 · 관리 로봇','robot','일을 없앨까요,\n거짓말을 없앨까요?','설치 공간은 세 칸입니다. 새 규칙은 기존 세계와 충돌할 수 있습니다.',C('로봇에게 일을 맡긴다',{stock:14,joy:-2,free:-6,trust:-2},'인류의 이력서가 짧아졌습니다.',{add:'robots'}),C('거짓말을 금지한다',{trust:12,joy:-8,free:-5},'“좋은 질문입니다”라는 말이 회의실에서 사라졌습니다.',{add:'truth'})),
 s=>has(s,'robots')?card('규칙 후폭풍','루프 · 로봇 대표','robot','로봇도\n월요일이 싫습니다.','“저희도 쉬는 날이 필요합니다.” 로봇이 계산기 앱을 닫았습니다.',C('교대제와 휴가를 준다',{stock:-8,trust:9,free:6,joy:2},'로봇에게 휴일이 생겼습니다.',{f:'robotrights'}),C('사람과 번갈아 일한다',{stock:-3,free:8,trust:6},'양쪽 모두 상대의 업무를 조금 이해했습니다.',{f:'sharedwork'})):card('규칙 후폭풍','토리 · 방송 진행자','journalist','“잘 지내?”가\n위험한 질문입니다.','인류가 너무 솔직해졌습니다. 안부 인사에 세 시간이 걸립니다.',C('말하지 않을 권리를 준다',{free:11,joy:5,trust:3,stock:-3},'인류가 고개를 끄덕이는 법을 배웠습니다.',{f:'silence'}),C('친절하게 말하는 법을 가르친다',{joy:10,trust:6,stock:-7},'“최악” 대신 “개선 여지가 많다”가 유행합니다.',{f:'kindtruth'})),
 s=>card('위험한 제안','루프 · 감정 관리실','robot','불행을 버그로\n처리할까요?','행복 수치를 자동으로 올릴 수 있습니다. “싫어요” 버튼도 함께 사라집니다.',C('행복을 자동 고정한다',{joy:22,free:-14,trust:-6,stock:-3},'모두가 웃기 시작했습니다. 반대 의견은 정확히 0입니다.',{add:'bliss'}),C('불평할 권리를 지킨다',{free:10,trust:7,joy:-3,stock:-3},'첫 불평이 도착했습니다. “왜 이제야 물어보나요?”',{f:'dissent'})),
 s=>has(s,'bliss')?card('규칙 후폭풍','모모 · 초등학생','child','지붕이 새는데\n다들 웃고 있어요.','어른들은 “촉촉해서 좋다”고 말합니다. 수리 요청은 한 건도 없습니다.',C('불만 신고 기능 복구',{free:12,trust:8,stock:-7,joy:-4},'불만이 쏟아지자 고칠 곳이 보였습니다.',{f:'complaint'}),C('센서가 대신 점검',{stock:-9,trust:6,joy:4,free:-2},'기계가 행복한 사람들 위에 우산을 펼쳤습니다.',{f:'sensors'})):card('시민 제안','모아 · 시민대표','worker','불평 게시판이\n너무 시끄럽습니다.','세상이 자유로워지자 불만도 자유로워졌습니다.',C('그대로 둔다',{free:6,trust:4,joy:-3},'시끄럽지만 필요한 소음이 남았습니다.'),C('좋은 제안만 모은다',{trust:7,joy:3,free:-4},'불평 중 일부가 실제 패치 요청으로 바뀌었습니다.'))
];
const randomEvents=[
 s=>card('긴급 패치','리오 · 기후 관제실','scientist','태양이 사흘째\n구름 뒤에 있습니다.','광합성 시민이 있다면 꽤 심각한 문제입니다.',C('저장 에너지를 푼다',{stock:has(s,'photo')?(flag(s,'sunbattery')?-1:-9):-3,trust:5},flag(s,'sunbattery')?'미리 저장한 햇빛이 빛을 발했습니다. 문자 그대로요.':'도시가 비상 전력을 나눴습니다.'),C('먹을 것을 나눈다',{stock:-7,joy:5,trust:8},'광합성을 하든 아니든 따뜻한 국은 인기가 있었습니다.')),
 s=>card('사회 패치','세나 · 주거 관리자','mayor','집이\n모자랍니다.','불멸자가 있다면 이 문제는 기다린다고 해결되지 않습니다.',C('공유 주택을 늘린다',{stock:-5,free:-4,joy:3,trust:7},'리모컨도 공동 관리하게 됐습니다.'),C('새 도시를 만든다',{stock:-11,free:7,joy:5,trust:2},'도시는 늘었고 출퇴근 거리도 늘었습니다.')),
 s=>card('문화 패치','유나 · 기록 보관소','journalist','모두의 과거를\n지워도 될까요?','실수 기록이 사람을 괴롭힙니다. 기억 공유가 켜져 있다면 더 그렇습니다.',C('잊힐 권리를 만든다',{free:10,trust:3,stock:-4},'인류에게 삭제 버튼이 생겼습니다.',{f:'privacy'}),C('기록하되 용서한다',{joy:8,trust:7,free:-1},'흑역사는 남았지만 처벌 목록에서는 빠졌습니다.',{f:'amnesty'})),
 s=>card('경제 패치','리오 · 자원부','scientist','창고가\n비어갑니다.','무언가를 포기하거나 생산 방식을 바꿔야 합니다.',C('필수품부터 배급',{stock:8,joy:-5,free:-5,trust:5},'화장지는 지켜냈습니다.'),C('낭비부터 줄인다',{stock:6,joy:-2,free:3,trust:2},'버려지는 물건이 조금 줄었습니다.')),
 s=>card('철학 패치','모모 · 초등학생','child','완벽한 세상은\n언제 완성돼요?','아이의 질문에 관리 화면이 잠시 멈춥니다.',C('완벽은 없다고 말한다',{trust:9,joy:2,free:4},'아이도 시스템도 조금 안심했습니다.'),C('다음 패치에 완성한다고 한다',{joy:5,trust:-7,stock:3},'거짓말 금지가 켜져 있었다면 매우 어색한 침묵이 흘렀습니다.')),
 s=>card('권리 패치','모아 · 시민대표','worker','관리자에게도\n제한이 필요합니다.','인류가 당신의 권한을 줄이자는 투표를 시작했습니다.',C('감사 권한을 넘긴다',{free:10,trust:10,stock:-3},'당신을 감시하는 사람들이 생겼습니다. 이상하게 안심됩니다.',{f:'audit'}),C('아직은 내가 관리한다',{stock:5,free:-9,trust:-8},'관리 속도는 빨라졌습니다. 불신도 함께 빨라졌습니다.',{f:'control'}))
];
const combos=[
 {ok:s=>has(s,'immortal')&&has(s,'photo'),make:s=>card('규칙 조합 발견','오래 · 214세 시민','elder','인류가\n숲이 되어갑니다.','죽지 않고 햇빛만 있으면 삽니다. 몇몇 시민이 뿌리내릴 자리를 찾습니다.',C('거대 정원을 만든다',{stock:13,joy:8,trust:5,free:-3},'새 직업 “정원 이웃”이 생겼습니다.',{combo:'영원한 정원'}),C('이동할 권리를 지킨다',{free:12,joy:6,stock:5},'인류는 숲 대신 아주 오래 산책하는 종이 됐습니다.',{combo:'걷는 숲'}))},
 {ok:s=>has(s,'shortwork')&&has(s,'robots'),make:s=>card('규칙 조합 발견','모아 · 시민대표','worker','월요일도\n쉬어도 되나요?','일은 로봇이 하고 인류는 이미 주 3일만 일합니다.',C('자동화 이익을 나눈다',{joy:13,free:9,trust:7,stock:-5},'월요일이 취미가 됐습니다.',{combo:'월요일 해방'}),C('하고 싶은 일을 맡는다',{stock:8,joy:8,free:5},'고양이 이름 짓기가 인기 직업이 됐습니다.',{combo:'취미 노동'}))},
 {ok:s=>has(s,'hive')&&has(s,'truth'),make:s=>card('규칙 충돌','토리 · 공개 방송','journalist','생각과 말이\n동시에 생중계됩니다.','기억이 연결됐고 거짓말도 못 합니다. 생일 서프라이즈가 멸종 위기입니다.',C('개인 생각은 비공개',{free:15,joy:5,stock:-5,trust:3},'마음속에 커튼을 달았습니다.',{combo:'마음의 커튼'}),C('모두 같은 감시 기준',{trust:10,free:-6,stock:3},'특권은 줄었습니다. 사생활도 함께 줄었습니다.',{combo:'비밀 없는 지구'}))}
];
function fresh(){return{turn:0,joy:55,stock:55,free:55,trust:55,rules:[],flags:{},seen:[],combos:[],history:[],last:'인류 업데이트를 시작합니다.',status:'play',run:(Number(localStorage.getItem('hpn-runs')||0)+1)}}
let s=null,drag=null;
function clamp(v){return Math.max(0,Math.min(100,v))}
function save(){try{localStorage.setItem('hpn-save',JSON.stringify(s))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('hpn-save')||'null')}catch(e){return null}}
function apply(choice){const before=JSON.parse(JSON.stringify(s));Object.entries(choice.fx||{}).forEach(([k,v])=>s[k]=clamp(s[k]+v));if(choice.add){if(!s.rules.includes(choice.add)){if(s.rules.length>=3)s.rules.shift();s.rules.push(choice.add)}}if(choice.f)s.flags[choice.f]=true;if(choice.combo&&!s.combos.includes(choice.combo))s.combos.push(choice.combo);s.last=choice.after;s.turn++;s.history.push({turn:s.turn,label:choice.label,after:choice.after,before});if([s.joy,s.stock,s.free,s.trust].some(x=>x<=0)||s.turn>=24){s.status='end';localStorage.setItem('hpn-runs',String(s.run));localStorage.removeItem('hpn-save')}else save();render()}
function nextCard(){if(s.turn<openings.length)return openings[s.turn](s);for(const c of combos){if(c.ok(s)&&!s.seen.includes(c.make(s).title)){const x=c.make(s);s.seen.push(x.title);return x}}return randomEvents[(s.turn-openings.length)%randomEvents.length](s)}
function meter(k,label,icon){const v=s[k];return `<div class="meter ${v<20?'danger':''}"><b>${icon} ${v}</b><span>${label}</span><div class="track"><i style="width:${v}%"></i></div></div>`}
function home(){const old=load();document.getElementById('app').innerHTML=`<section class="screen"><div class="top"><div class="brand"><span class="mark">H</span>HUMANITY PATCH NOTES</div><button class="ghost" onclick="shareSite()">공유</button></div><div class="hero"><span class="pill">HUMANITY · EXPERIMENT</span><h1>인류<br><em>패치노트.</em></h1><div class="tag">고치려고 했을 뿐인데.</div><p class="desc">잠을 지우고, 죽음을 고치고, 햇빛을 먹게 한다.<br>당신의 선의가 만든 세상은 어디로 갈까요?</p><div class="planet"></div><div class="statsIntro"><div><strong>24번</strong><span>세상을 바꾸는 결정</span></div><div><strong>8개</strong><span>충돌하는 세계 규칙</span></div><div><strong>∞</strong><span>조합되는 문명</span></div></div></div>${old&&old.status==='play'?`<button class="primary" onclick="resume()">진행 중인 실험 이어하기 →</button><button class="secondary" onclick="start()">새로운 인류 만들기</button>`:`<button class="primary" onclick="start()">인류 업데이트 시작 →</button>`}<p class="micro">카드를 좌우로 밀거나 선택지를 누르세요.<br>행복·자원·자유·신뢰 중 하나라도 0이면 실험 종료.</p></section>`}
function start(){s=fresh();save();render()}function resume(){s=load()||fresh();render()}
function render(){if(!s||s.status==='end')return ending();const c=nextCard();let prog='';for(let i=0;i<24;i++)prog+=`<i class="${i<s.turn?'done':i===s.turn?'now':''}"></i>`;document.getElementById('app').innerHTML=`<section class="screen"><div class="top"><div class="brand"><span class="mark">H</span>PATCH v0.${String(s.turn+1).padStart(2,'0')}</div><button class="ghost" onclick="home()">처음</button></div><div class="phase"><span>실험 ${s.run}</span><span>${s.turn}/24</span></div><div class="progress">${prog}</div><div class="meters">${meter('joy','행복','☀️')}${meter('stock','자원','📦')}${meter('free','자유','🪽')}${meter('trust','신뢰','🤝')}</div><div class="rulesLabel">현재 세계 규칙 · 최대 3개</div><div class="rules">${[0,1,2].map(i=>s.rules[i]?`<div class="rule">${R[s.rules[i]].n}</div>`:`<div class="rule empty">빈 슬롯</div>`).join('')}</div><div class="news">${s.last}</div><div class="cardStack"><article class="card" id="card"><div class="eyebrow">${c.type}</div><div class="actor">${c.actor}</div><div class="avatar">${EM[c.pic]||'🌍'}</div><h2>${c.title}</h2><p class="body">${c.body}</p><div class="choices"><button class="choice" onclick="pick(0)">← ${c.ch[0].label}</button><button class="choice" onclick="pick(1)">${c.ch[1].label} →</button></div><div class="hint">← → 키보드 또는 좌우 스와이프</div></article></div></section>`;bindSwipe()}
function pick(i){const c=nextCard();const el=document.getElementById('card');if(el){el.style.transform=`translateX(${i?70:-70}px) rotate(${i?3:-3}deg)`;el.style.opacity='.15';setTimeout(()=>apply(c.ch[i]),150)}else apply(c.ch[i])}
function bindSwipe(){const el=document.getElementById('card');if(!el)return;el.addEventListener('pointerdown',e=>{drag={x:e.clientX};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;el.style.transform=`translateX(${dx*.35}px) rotate(${dx*.012}deg)`});el.addEventListener('pointerup',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag=null;if(Math.abs(dx)>80)pick(dx>0?1:0);else el.style.transform=''})}
function ending(){if(!s){home();return}const vals=[s.joy,s.stock,s.free,s.trust];const failed=vals.some(v=>v<=0);let name='스스로 운영하는 인류',desc='완벽하지 않지만, 문제를 발견하고 다시 고칠 수 있는 문명이 남았습니다.',tag='관리자 권한 이전';if(failed){const m=Math.min(...vals),i=vals.indexOf(m);const names=['웃음을 잃은 문명','텅 빈 창고','잠긴 지구','불신의 시대'];const ds=['행복을 최적화하다 행복을 잃었습니다.','좋은 의도만으로 자원을 만들 수는 없었습니다.','안전을 위해 자유를 너무 많이 줄였습니다.','인류가 관리자 말을 더 이상 믿지 않습니다.'];name=names[i];desc=ds[i];tag=['행복 0','자원 0','자유 0','신뢰 0'][i]}else if(has(s,'immortal')&&has(s,'photo')){name='영원한 정원';desc='죽지 않고 햇빛을 먹는 인류가 오래 지속되는 문명을 만들었습니다.';tag='불멸 × 광합성'}else if(has(s,'shortwork')&&has(s,'robots')){name='월요일 해방';desc='일은 줄었고 자동화는 늘었습니다. 이제 인류는 무엇을 위해 일할지 고민합니다.';tag='주 3일 × 로봇 노동'}else if(has(s,'bliss')){name='완벽하게 행복한 지구';desc='모두가 행복합니다. 이것을 문제라고 말할 사람도 거의 남지 않았습니다.';tag='행복 고정'}const score=Math.max(0,Math.round((s.joy+s.stock+s.free+s.trust)/4+s.combos.length*12));document.getElementById('app').innerHTML=`<section class="screen end"><div class="top"><div class="brand"><span class="mark">H</span>FINAL PATCH</div><button class="ghost" onclick="home()">처음</button></div><div class="endPlanet">${failed?'🌍':'🌎'}</div><div class="status">${failed?'EXPERIMENT CLOSED':'EXPERIMENT COMPLETE'}</div><h1>${name}</h1><p class="endDesc">${desc}</p><div class="scoreGrid"><div><strong>${s.turn}<small>/24</small></strong><span>결정</span></div><div><strong>${score}</strong><span>문명 점수</span></div><div><strong>${s.combos.length}</strong><span>조합 발견</span></div></div><div class="patches"><div class="patchTitle"><span>YOUR PATCH NOTES</span><span>RUN ${s.run}</span></div>${s.rules.length?s.rules.map(r=>`<div class="patch">✓ ${R[r].note}</div>`).join(''):`<div class="patch">✓ 기본 인류를 유지했습니다.</div>`}<div class="patch">${failed?'⚠ 알려진 문제: '+tag:'✓ 최종 상태: '+tag}</div></div><button class="primary" onclick="start()">다른 인류 만들어보기 →</button><div class="actions2"><button class="secondary" onclick="shareResult('${name.replace(/'/g,"\\'")}','${tag.replace(/'/g,"\\'")}')">내 패치노트 공유</button><button class="secondary" onclick="undo()">마지막 선택 되돌리기</button></div><p class="micro">같은 선택도 설치된 세계 규칙에 따라 다른 결과를 만들 수 있습니다.</p></section>`}
function undo(){if(!s||!s.history.length){toast('되돌릴 선택이 없습니다.');return}const prev=s.history[s.history.length-1].before;prev.status='play';s=prev;save();render()}
function copy(text){if(navigator.share){navigator.share({title:'인류 패치노트',text,url:APP_URL}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text+'\n'+APP_URL).then(()=>toast('복사했습니다.'))}else toast('주소를 복사해 공유해주세요.')}
function shareResult(name,tag){copy(`내 인류의 결말: ${name}\n${tag}\n인류의 결함을 고쳐봤습니다.`)}function shareSite(){copy('인류의 결함을 직접 패치해보세요. — 인류 패치노트')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1700)}
window.addEventListener('keydown',e=>{if(!s||s.status!=='play')return;if(e.key==='ArrowLeft')pick(0);if(e.key==='ArrowRight')pick(1)});home();
</script></body></html>
